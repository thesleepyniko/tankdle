# First run: `bun run setup`. Full stack: `docker compose up -d --build`. Dev db only: `bun run db:start`.
# Values come from .env (see .env.example).
services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tankdle}:${POSTGRES_PASSWORD:?run bun run setup}@db:5432/${POSTGRES_DB:-tankdle}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run bun run setup} # generated by bun run setup
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      IMAGE_DIR: /app/data/images
      PORT: 3000
      # Public URL of the site, needed for form actions (CSRF check). Set to your
      # https:// domain when running behind a reverse proxy.
      ORIGIN: ${ORIGIN:-http://localhost:8080}
    volumes:
      - images:/app/data/images
    ports:
      - ${APP_PORT:-8080}:3000
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    build:
      context: .
      target: build
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tankdle}:${POSTGRES_PASSWORD:?run bun run setup}@db:5432/${POSTGRES_DB:-tankdle}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tankdle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bun run setup}
      POSTGRES_DB: ${POSTGRES_DB:-tankdle}
    volumes:
      - pgdata:/var/lib/postgresql
    # Loopback only, so local dev can reach it without exposing it publicly
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  images:
